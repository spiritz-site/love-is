<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главная</title>
  <link rel="stylesheet" href="home-style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    .card { transition: transform 0.3s ease; cursor: pointer; }
    .card:hover { transform: scale(1.05); }
    /* Спиннер загрузки */
    #loading { text-align: center; padding: 20px; font-size: 18px; color: #666; }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="search-box">
      <img src="Search.png" alt="search">
      <input type="text" id="search-input" placeholder="Іздеу / Поиск">
      <span id="clear-search" style="display:none; cursor:pointer; margin-left:15px; font-size:20px; color:#999;">&times;</span>
    </div>
    <img class="logo" src="spiritz.jpg" alt="logo" onclick="location.href='index.html';" style="cursor: pointer;">
  </header>

  <section class="banner">
    <img src="banner.png" alt="banner">
  </section>

  <section class="categories">
    <button class="category-btn active" data-filter="all">Барлығы</button>
    <button class="category-btn" data-filter="tshirt">Футболка</button>
    <button class="category-btn" data-filter="sweatshirt">Свитшот</button>
    <button class="category-btn" data-filter="hoodie">Толстовка</button>
    <button class="category-btn" data-filter="polo">Поло</button>
    <button class="category-btn" data-filter="designs">Дизайн</button>
  </section>

  <section class="products" id="products-container">
    <div id="loading">Загрузка товаров...</div>
    </section>
  
  <footer>© 2025 Love is — сайт by <a href="#" style="color:#1DA1F2; text-decoration:none;">spiritz.design</a></footer>
</div>

<script>
  // ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШ CSV (из Google Sheets "Опубликовать в интернете")
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRpiAioBFnkMpw75uD--nBtz9zsjEcOBtN72qQFCfV_zvI9UYzKiQnM6eOMr51PNkSLWp_V8FPoxMt_/pub?output=csv'; 

  const container = document.getElementById('products-container');
  const searchInput = document.getElementById('search-input');
  const clearBtn = document.getElementById('clear-search');
  const categoryBtns = document.querySelectorAll('.category-btn');
  
  let allProducts = [];
  let currentCategory = 'all';

  // 1. Загрузка данных
  fetch(SHEET_CSV_URL)
    .then(res => res.text())
    .then(csvText => {
      allProducts = csvToJSON(csvText);
      renderProducts(allProducts);
    })
    .catch(err => {
      container.innerHTML = '<p style="text-align:center; color:red;">Ошибка загрузки каталога</p>';
      console.error(err);
    });

  // 2. Функция рендера карточек
  function renderProducts(products) {
    container.innerHTML = '';
    
    if (products.length === 0) {
      container.innerHTML = '<p style="padding:20px;">Ничего не найдено</p>';
      return;
    }

    products.forEach(product => {
      // Фильтрация
      const matchesCategory = currentCategory === 'all' || product.category === currentCategory;
      const matchesSearch = product.title.toLowerCase().includes(searchInput.value.toLowerCase());

      if (matchesCategory && matchesSearch) {
        const card = document.createElement('div');
        card.className = `card ${product.category}`;
        // При клике переходим на product.html с ID товара
        card.onclick = () => location.href = `product.html?id=${product.id}`;
        
        card.innerHTML = `
          <img src="${product.main_image}" alt="${product.title}">
          <p>${product.title}</p>
          <span>${product.price}₸</span>
        `;
        container.appendChild(card);
      }
    });
    
    // Управление крестиком поиска
    clearBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none';
  }

  // 3. Обработчики событий
  searchInput.addEventListener('input', () => renderProducts(allProducts));
  
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    renderProducts(allProducts);
    searchInput.focus();
  });

  categoryBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.getAttribute('data-filter');
      renderProducts(allProducts);
    });
  });

  // 4. Парсер CSV в JSON
  function csvToJSON(csv) {
    const lines = csv.split('\n');
    const result = [];
    const headers = lines[0].split(',').map(h => h.trim());

    for (let i = 1; i < lines.length; i++) {
      if (!lines[i]) continue;
      // Простой сплит по запятой (внимание: не используйте запятые внутри описания в Google Sheets!)
      const obj = {};
      const currentline = lines[i].split(','); 

      headers.forEach((header, index) => {
        obj[header] = currentline[index] ? currentline[index].trim() : '';
      });
      result.push(obj);
    }
    return result;
  }
</script>
</body>
</html>
